version: 2
updates:
  # Check the current default edge branch.
  - package-ecosystem: "github-actions"
    directory: "/"
    labels: []
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  # Also check other (non-default) edge branches.
  - package-ecosystem: "github-actions"
    directory: "/"
    labels: []
    schedule:
      interval: "weekly"
    target-branch: "v2-edge"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  # Also check the candidate branches.
  - package-ecosystem: "github-actions"
    directory: "/"
    labels: []
    schedule:
      interval: "weekly"
    target-branch: "v2-candidate"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
